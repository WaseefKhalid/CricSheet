# ── Waseef Analytical Portal — "Daylight" WHITE theme ────────────────────────
# White kit on a sunny day: white page, navy ink, deep-amber accent, ball red.
# The CSS and charts in components/theme.py follow `base` below automatically.
# For the night theme, use config-dark.toml instead (rename it to config.toml).
# Fonts are self-hosted from /static/fonts so the site never depends on Google.

[server]
maxUploadSize = 500
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#C47510"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FB"
textColor = "#0E1528"
linkColor = "#A85A08"
linkUnderline = false
borderColor = "#DFE4EC"
dataframeBorderColor = "#E5E9F0"
dataframeHeaderBackgroundColor = "#EEF2F7"
dataframeHeaderTextColor = "#3D4761"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 15
font = "Instrument Sans, system-ui, sans-serif"
headingFont = "Big Shoulders Display, Instrument Sans, sans-serif"
headingFontWeights = [800, 700, 700, 700, 600, 600]
metricValueFontSize = "2.4rem"
metricValueFontWeight = 700
redColor = "#D6404B"
orangeColor = "#C47510"
blueColor = "#2A78D6"
violetColor = "#6E56CF"
chartCategoricalColors = ["#C47510", "#2A78D6", "#D6404B", "#6E56CF"]

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-Variable.woff2"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "Big Shoulders Display"
url = "app/static/fonts/BigShouldersDisplay-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "Big Shoulders Display"
url = "app/static/fonts/BigShouldersDisplay-700.woff2"
weight = 700

[[theme.fontFaces]]
family = "Big Shoulders Display"
url = "app/static/fonts/BigShouldersDisplay-800.woff2"
weight = 800

[theme.sidebar]
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#DFE4EC"
